<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MTO Compass</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF9F6;--sf:#FFFFFF;--sf2:#F3F1EC;--ink:#1A1A17;--mut:#6B6A64;--ln:#ECEAE4;--ac:#0F6B4F;--acs:#E4F1EB;--on:#fff;--wr:#B4570A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121211;--sf:#1A1A18;--sf2:#232321;--ink:#F2F1EC;--mut:#9A988F;--ln:#2C2B28;--ac:#4FC49A;--acs:#16302A;--on:#0B1A15;--wr:#E8A15C}}
:root[data-theme="dark"]{--bg:#121211;--sf:#1A1A18;--sf2:#232321;--ink:#F2F1EC;--mut:#9A988F;--ln:#2C2B28;--ac:#4FC49A;--acs:#16302A;--on:#0B1A15;--wr:#E8A15C}
html{scroll-padding-top:env(safe-area-inset-top,0px)}html,body{height:100%;margin:0;background:var(--bg)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{color:var(--ink);font:400 15px/1.5 Inter,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:430px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
@media(min-width:500px){#app{max-height:860px;margin:12px auto;border:1px solid var(--ln);border-radius:36px}}
h1,h2,h3{margin:0;letter-spacing:-.02em;font-weight:600}h1{font-size:28px;line-height:1.15}h2{font-size:22px}h3{font-size:15px}
p{margin:4px 0;color:var(--mut)}.sm{font-size:12px;color:var(--mut)}
.body{flex:1;overflow-y:auto;padding:18px 16px 12px}.pad{flex:1;overflow-y:auto;padding:28px 22px;display:flex;flex-direction:column}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:10px 0}.card.t{cursor:pointer}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.l{display:flex;align-items:center;gap:10px}
.tag{font-size:11px;font-weight:500;padding:3px 9px;border-radius:99px;background:var(--sf2);color:var(--mut);cursor:default;display:inline-block;margin:2px 2px 2px 0}.tag.g{background:var(--acs);color:var(--ac)}.tag.w{color:var(--wr)}
.bar{height:6px;background:var(--sf2);border-radius:9px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .3s}
.btn{display:block;width:100%;border:0;background:var(--ac);color:var(--on);border-radius:14px;padding:14px;font:600 15px Inter,sans-serif;margin-top:14px;cursor:pointer}.btn.o{background:var(--sf);color:var(--ink);border:1px solid var(--ln)}.btn.s{padding:9px;font-size:13px;margin-top:10px}
.lnk{background:none;border:0;color:var(--ac);font:500 14px Inter,sans-serif;cursor:pointer;padding:6px}
label{font-size:12px;font-weight:500;color:var(--mut);display:block;margin:14px 0 6px}
input,textarea{width:100%;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:12px;padding:13px;font:400 15px Inter,sans-serif;outline:0}input:focus,textarea:focus{border-color:var(--ac)}input.er{border-color:var(--wr)}
.seg{display:flex;background:var(--sf2);border-radius:12px;padding:3px;gap:2px;margin:14px 0}.seg button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font:500 13px Inter,sans-serif;color:var(--mut);cursor:pointer}.seg button.on{background:var(--sf);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.bn{display:flex;border-top:1px solid var(--ln);background:var(--sf);padding:6px 6px 10px}.bn button{flex:1;border:0;background:none;color:var(--mut);font:500 10.5px Inter,sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer}.bn button.on{color:var(--ac)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.av{width:38px;height:38px;border-radius:50%;background:var(--acs);color:var(--ac);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.bell{position:relative;border:1px solid var(--ln);background:var(--sf);border-radius:50%;width:38px;height:38px;color:var(--ink);cursor:pointer;display:grid;place-items:center}.bell b{position:absolute;top:-3px;right:-3px;background:var(--wr);color:#fff;font-size:10px;border-radius:99px;min-width:16px;height:16px;display:grid;place-items:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g2 .card{margin:0}.big{font-size:26px;font-weight:600;letter-spacing:-.02em}
.otp{display:flex;gap:8px}.otp input{text-align:center;padding:13px 0;font-size:18px;font-weight:600}
.tl{border-left:2px solid var(--ln);margin-left:6px;padding-left:16px}.tl .card{position:relative}.tl .card:before{content:"";position:absolute;left:-23px;top:18px;width:10px;height:10px;border-radius:50%;background:var(--ln)}.tl .a:before{background:var(--ac)}
.chart{display:flex;align-items:flex-end;gap:8px;height:90px;margin-top:10px}.chart i{flex:1;background:var(--acs);border-radius:6px 6px 0 0}.chart i.k{background:var(--ac)}
.chk{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--ln);background:var(--sf);display:grid;place-items:center;color:var(--on);font-size:13px;flex:none;cursor:pointer}.chk.on{background:var(--ac);border-color:var(--ac)}.dn{text-decoration:line-through;color:var(--mut)}
.tgl{width:44px;height:26px;border-radius:99px;background:var(--ln);position:relative;border:0;cursor:pointer;flex:none}.tgl:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.tgl.on{background:var(--ac)}.tgl.on:after{transform:translateX(18px)}
.st{display:flex;gap:4px}.st button{border:0;background:none;color:var(--ln);cursor:pointer;font-size:28px;padding:0}.st .on{color:var(--wr)}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;z-index:20;animation:fi .2s}.sh{background:var(--bg);width:100%;border-radius:24px 24px 0 0;padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:85%;overflow-y:auto;animation:su .25s ease-out}.sh:before{content:"";display:block;width:36px;height:4px;border-radius:9px;background:var(--ln);margin:0 auto 14px}
.toast{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13px;z-index:40;animation:up .25s both;white-space:nowrap}
.ban{position:absolute;left:12px;right:12px;top:12px;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.14);animation:dn .3s ease-out;cursor:pointer}
.un{border-left:3px solid var(--ac)}
.sp{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;cursor:pointer}.sp .ring{stroke-dasharray:320;stroke-dashoffset:320;animation:dr 1.1s ease-out .2s forwards}.sp .nd{opacity:0;transform-origin:50px 50px;transform:rotate(-70deg);animation:nd .9s cubic-bezier(.2,.8,.2,1) 1s forwards}.sp .wm{opacity:0;transform:translateY(8px);animation:up .6s ease-out 1.7s forwards}.sp .tg{opacity:0;animation:up .6s ease-out 2.1s forwards}
@keyframes dr{to{stroke-dashoffset:0}}@keyframes nd{to{opacity:1;transform:rotate(0)}}@keyframes up{to{opacity:1;transform:translateX(var(--tx,0))}}@keyframes fi{from{opacity:0}}@keyframes su{from{transform:translateY(100%)}}@keyframes dn{from{transform:translateY(-120%)}}
.fade{animation:fd .3s ease-out both}@keyframes fd{from{opacity:0;transform:translateY(6px)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
var A=document.getElementById('app'),rt=0,otpOk=0;
var S={role:'user',tab:0,lang:'en',lock:1,q:'',rv:'pending',
logs:[{t:'Dealer visit notes, Chattogram',g:['Marketing','Dealers'],d:'Yesterday'},{t:'Drafted Q2 campaign brief',g:['Reporting'],d:'Mon'}],
tasks:[{t:'Send Q2 campaign report',due:'5 PM',x:0},{t:'1:1 with mentor',due:'3 PM',x:0},{t:'Update dealer list',due:'Fri',x:1}],
goals:[{t:'Excel for business',p:70},{t:'Business writing (Bangla/English)',p:30}],
rot:[{n:'Finance',w:'Jan – Feb',s:'Done',o:['Budget basics','Month-end close','Cash-flow report']},{n:'Marketing',w:'Mar – Apr',s:'Active',o:['Campaign planning','Dealer visits','Market report','Social metrics']},{n:'Operations',w:'May – Jun',s:'Upcoming',o:['Supply chain','Quality checks']},{n:'Sales',w:'Jul – Aug',s:'Upcoming',o:['Pipeline','Client calls']}],
tr:[{n:'Nusrat Jahan',d:'Marketing · Wk 3',p:38},{n:'Tanvir Hasan',d:'Finance · Wk 7',p:72},{n:'Mim Akter',d:'Operations · Wk 2',p:20},{n:'Rafi Ahmed',d:'Sales · Wk 5',p:55}],
rvs:[{n:'Tanvir Hasan',d:'Finance rotation · evaluation',due:'Due Fri',s:'pending'},{n:'Rafi Ahmed',d:'Sales rotation · mid-term',due:'Due 8 Nov',s:'pending'},{n:'Mim Akter',d:'Orientation review',due:'Done',s:'approved'}],
nf:{user:[{t:'Reminder',m:'Add today’s log before 9 PM',r:0,w:'9:00 AM'},{t:'Mentor',m:'1:1 with Mr. Rahman at 3:00 PM',r:0,w:'8:30 AM'}],admin:[{t:'Review submitted',m:'Tanvir Hasan submitted a Finance review',r:0,w:'10:12 AM'},{t:'Inactive',m:'3 trainees have not logged in 5 days',r:0,w:'Yesterday'}]}};
var L={Home:'হোম',Rotation:'রোটেশন',Log:'লগ',Growth:'অগ্রগতি',Me:'আমি',Overview:'ওভারভিউ',Trainees:'প্রশিক্ষণার্থী',Reviews:'রিভিউ',Reports:'রিপোর্ট',Settings:'সেটিংস'};
function T(x){return S.lang=='bn'&&L[x]?L[x]:x}
var P={home:'M3 11l9-8 9 8v10H3z',rot:'M4 6h16M4 12h10M4 18h16',log:'M4 4h16v16H4zM12 8v8M8 12h8',grow:'M3 17l6-6 4 4 8-8M15 7h6v6',me:'M12 12a4 4 0 100-8 4 4 0 000 8zM4 21a8 8 0 0116 0',us:'M9 11a4 4 0 100-8 4 4 0 000 8zM2 21a7 7 0 0114 0M17 3a4 4 0 010 8M22 21a7 7 0 00-4-6',ck:'M5 12l5 5 9-10',ch:'M4 20V10M10 20V4M16 20v-7M22 20H2',gr:'M12 15a3 3 0 100-6 3 3 0 000 6zM19 12h2M3 12h2M12 3v2M12 19v2',ov:'M3 3h8v8H3zM13 3h8v5h-8zM13 11h8v10h-8zM3 14h8v7H3z',bl:'M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9M10 21a2 2 0 004 0'};
function ic(k){return '<svg class="i" viewBox="0 0 24 24"><path d="'+P[k]+'"/></svg>'}
function ini(n){return n.split(' ').map(function(w){return w[0]}).join('').slice(0,2)}
function set(h){A.innerHTML=h}
function toast(m){var d=document.createElement('div');d.className='toast';d.style.setProperty('--tx','-50%');d.style.transform='translateX(-50%)';d.textContent=m;A.appendChild(d);setTimeout(function(){d.remove()},2200)}
function sheet(h){cl();var o=document.createElement('div');o.className='ov';o.id='ov';o.onclick=function(e){if(e.target==o)cl()};o.innerHTML='<div class="sh">'+h+'</div>';A.appendChild(o)}
function cl(){var o=document.getElementById('ov');if(o)o.remove()}
function logo(s){return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 100 100" fill="none" stroke="var(--ac)" stroke-width="4" stroke-linecap="round"><circle class="ring" cx="50" cy="50" r="46"/><path class="nd" d="M50 20l12 30-12 30-12-30z" fill="var(--ac)" stroke="none"/></svg>'}
function back(f){return '<button class="lnk" style="align-self:flex-start;padding:0 0 14px" onclick="'+f+'()">‹ Back</button>'}
/* splash + auth */
function splash(){set('<div class="sp" onclick="login()">'+logo(110)+'<h1 class="wm">MTO Compass</h1><p class="tg">Your trainee journey, organised.</p></div>');setTimeout(function(){if(document.querySelector('.sp'))login()},3300)}
function login(){cl();set('<div class="pad fade"><div style="margin-bottom:24px">'+logo(44).replace(/class="(ring|nd)"/g,'')+'</div><h1>Welcome back</h1><p>Sign in to continue your programme.</p><div class="seg"><button id="r1" class="'+(S.role=='user'?'on':'')+'" onclick="rl(\'user\')">Trainee</button><button id="r2" class="'+(S.role=='admin'?'on':'')+'" onclick="rl(\'admin\')">Admin / HR</button></div><label>Phone or work email</label><input id="f1" placeholder="01XXXXXXXXX or name@company.com"><label>Password</label><input id="f2" type="password" placeholder="••••••••"><div style="text-align:right"><button class="lnk" onclick="forgot()">Forgot password?</button></div><button class="btn" onclick="signin()">Sign in</button><button class="btn o" onclick="enter()">Use fingerprint</button><div style="flex:1"></div><p style="text-align:center">New trainee? <button class="lnk" onclick="reg()">Create account</button></p></div>')}
function rl(r){S.role=r;r1.className=r=='user'?'on':'';r2.className=r=='admin'?'on':''}
function signin(){var a=f1.value.trim(),b=f2.value.trim();f1.className=a?'':'er';f2.className=b?'':'er';if(a&&b)enter();else toast('Enter your phone/email and password')}
function reg(){set('<div class="pad fade">'+back('login')+'<h1>Create account</h1><p>Use the company code from HR.</p><label>Full name</label><input id="a1" placeholder="Nusrat Jahan"><label>Company code</label><input id="a2" placeholder="BD-2026-0412"><label>Work email</label><input id="a3" placeholder="name@company.com"><label>Password</label><input id="a4" type="password" placeholder="Min. 8 characters"><button class="btn" onclick="regGo()">Continue</button></div>')}
function regGo(){var ok=1;['a1','a2','a3','a4'].forEach(function(i){var e=document.getElementById(i);if(!e.value.trim()){e.className='er';ok=0}else e.className=''});if(!ok)return toast('Please fill all fields');if(document.getElementById('a4').value.length<8)return toast('Password needs 8+ characters');otp()}
function otp(){set('<div class="pad fade">'+back('reg')+'<h1>Verify your number</h1><p>Enter the 6-digit code sent to 01•••••• 482.</p><div class="otp" style="margin-top:22px">'+[0,1,2,3,4,5].map(function(i){return '<input maxlength="1" inputmode="numeric" oninput="this.value&&this.nextElementSibling&&this.nextElementSibling.focus()">'}).join('')+'</div><p class="sm" style="margin-top:12px">Demo: any 6 digits work</p><button class="btn" onclick="otpGo()">Verify</button></div>')}
function otpGo(){var v=[].map.call(document.querySelectorAll('.otp input'),function(i){return i.value}).join('');if(v.length<6)return toast('Enter all 6 digits');S.role='user';setup()}
function forgot(){set('<div class="pad fade">'+back('login')+'<h1>Reset password</h1><p>We’ll send a code to your phone or email.</p><label>Phone or work email</label><input id="fg"><button class="btn" onclick="if(!fg.value.trim())return toast(\'Enter phone or email\');toast(\'Reset code sent\');login()">Send code</button></div>')}
function setup(){set('<div class="pad fade"><p class="sm">Final step</p><h1>Set up your programme</h1><label>Programme length</label><div class="seg" id="pl"><button onclick="pk(this)">6 mo</button><button class="on" onclick="pk(this)">12 mo</button><button onclick="pk(this)">18 mo</button></div><label>Start date</label><input value="01 Jan 2027"><label>Language</label><div class="seg"><button class="'+(S.lang=='en'?'on':'')+'" onclick="S.lang=\'en\';setup()">English</button><button class="'+(S.lang=='bn'?'on':'')+'" onclick="S.lang=\'bn\';setup()">বাংলা</button></div><button class="btn" onclick="enter()">Finish setup</button></div>')}
function pk(b){[].forEach.call(b.parentNode.children,function(x){x.className=''});b.className='on'}
function enter(){S.tab=0;shell();setTimeout(function(){if(!document.getElementById('app').querySelector('.bn'))return;push(S.role=='admin'?'Review submitted':'Reminder',S.role=='admin'?'Mim Akter submitted an orientation log':'Don’t forget to log today’s work')},5000)}
/* shell */
var NAV={user:[['home','Home'],['rot','Rotation'],['log','Log'],['grow','Growth'],['me','Me']],admin:[['ov','Overview'],['us','Trainees'],['ck','Reviews'],['ch','Reports'],['gr','Settings']]};
function shell(){var n=NAV[S.role].map(function(x,i){return '<button class="'+(i==S.tab?'on':'')+'" onclick="S.tab='+i+';shell()">'+ic(x[0])+T(x[1])+'</button>'}).join('');var o=document.getElementById('ov');set('<div class="body fade">'+V[S.role][S.tab]()+'</div><nav class="bn">'+n+'</nav>');if(o)A.appendChild(o)}
function unread(){return S.nf[S.role].filter(function(x){return!x.r}).length}
function hd(t,s){var u=unread();return '<div class="hd"><div><p class="sm" style="margin:0">'+s+'</p><h2>'+T(t)+'</h2></div><div class="l"><button class="bell" onclick="nts()">'+ic('bl')+(u?'<b>'+u+'</b>':'')+'</button><div class="av" onclick="S.tab='+(S.role=='admin'?4:4)+';shell()">'+(S.role=='admin'?'HR':'NJ')+'</div></div></div>'}
/* notifications */
function push(t,m){S.nf[S.role].unshift({t:t,m:m,r:0,w:'Now'});if(A.querySelector('.bn'))shell();var b=document.createElement('div');b.className='ban';b.innerHTML='<b>'+t+'</b><p style="margin:2px 0 0">'+m+'</p>';b.onclick=function(){b.remove();nts()};A.appendChild(b);setTimeout(function(){b.remove()},4200)}
function nts(){var l=S.nf[S.role].map(function(x,i){return '<div class="card t '+(x.r?'':'un')+'" onclick="S.nf[S.role]['+i+'].r=1;nts();shell()"><div class="row"><b>'+x.t+'</b><span class="sm">'+x.w+'</span></div><p style="margin:2px 0 0">'+x.m+'</p></div>'}).join('');sheet('<div class="row"><h2>Notifications</h2><button class="lnk" onclick="S.nf[S.role].forEach(function(x){x.r=1});nts();shell()">Mark all read</button></div>'+(l||'<p>Nothing yet.</p>'))}
function note(role,t,m){S.nf[role].unshift({t:t,m:m,r:0,w:'Now'})}
/* views */
function bar(p){return '<div class="bar"><i style="width:'+p+'%"></i></div>'}
var TAGS=['Marketing','Reporting','Dealers','Analysis'];
var V={user:[
function(){var due=S.tasks.filter(function(x){return!x.x}).length;return hd('Nusrat','Good morning')+'<div class="card t" onclick="rd(1)"><div class="row"><b>Rotation 2 · Marketing</b><span class="tag g">Week 3/8</span></div><p class="sm">Supervisor: Mr. Rahman</p>'+bar(38)+'</div><div class="g2"><div class="card"><div class="big">'+S.logs.length+'</div><p class="sm">Logs this month</p></div><div class="card"><div class="big">'+due+'</div><p class="sm">Tasks pending</p></div></div><div class="row" style="margin:18px 0 0"><h3>Tasks</h3><button class="lnk" onclick="addTask()">+ Add</button></div>'+S.tasks.map(function(x,i){return '<div class="card"><div class="row"><div class="l"><div class="chk '+(x.x?'on':'')+'" onclick="S.tasks['+i+'].x^=1;shell()">'+(x.x?'✓':'')+'</div><span class="'+(x.x?'dn':'')+'">'+x.t+'</span></div><span class="tag '+(x.x?'':'w')+'">'+x.due+'</span></div></div>'}).join('')+'<button class="btn" onclick="S.tab=2;shell()">+ Add today’s log</button>'},
function(){return hd('Rotation','12-month programme')+'<div class="tl">'+S.rot.map(function(x,i){return '<div class="card t '+(x.s=='Active'?'a':'')+'" onclick="rd('+i+')"><div class="row"><b>'+(i+1)+' · '+x.n+'</b><span class="tag '+(x.s=='Upcoming'?'':'g')+'">'+x.s+'</span></div><p class="sm">'+x.w+' · '+x.o.length+' objectives</p></div>'}).join('')+'</div>'},
function(){return hd('Log','Works offline')+'<label>What did you work on?</label><textarea id="lt" rows="4" placeholder="Prepared the campaign report…"></textarea><label>Tags</label><div>'+TAGS.map(function(t){return '<span class="tag" style="cursor:pointer;padding:6px 12px" onclick="this.classList.toggle(\'g\')">'+t+'</span>'}).join('')+'</div><div class="g2" style="margin-top:14px"><div class="card t" style="text-align:center" onclick="toast(\'Voice note attached (demo)\')">🎙 Voice</div><div class="card t" style="text-align:center" onclick="toast(\'Photo attached (demo)\')">📷 Photo</div></div><button class="btn" onclick="saveLog()">Save log</button><h3 style="margin:20px 0 4px">Recent</h3>'+S.logs.map(function(x,i){return '<div class="card t" onclick="lg('+i+')"><div class="row"><b>'+x.t+'</b><span class="sm">'+x.d+'</span></div><div>'+x.g.map(function(g){return '<span class="tag g">'+g+'</span>'}).join('')+'</div></div>'}).join('')},
function(){return hd('Growth','Goals & feedback')+'<div class="row"><h3>Learning goals</h3><button class="lnk" onclick="addGoal()">+ Add</button></div>'+S.goals.map(function(x,i){return '<div class="card"><div class="row"><b>'+x.t+'</b><span class="sm">'+x.p+'%</span></div>'+bar(x.p)+'<button class="btn o s" onclick="S.goals['+i+'].p=Math.min(100,S.goals['+i+'].p+10);if(S.goals['+i+'].p==100)toast(\'Goal completed 🎉\');shell()">+10% progress</button></div>'}).join('')+'<div class="card"><b>Mentor note</b><p>“Good ownership. Work on presenting numbers.”</p><p class="sm">Mr. Rahman · 12 Mar</p></div><button class="btn" onclick="pack()">Build review pack (PDF)</button>'},
function(){return hd('Me','Profile')+'<div class="card"><div class="l"><div class="av">NJ</div><div><b>Nusrat Jahan</b><div class="sm">MTO · Batch 2027 · Dhaka</div></div></div></div><div class="card"><div class="row"><span>বাংলা language</span><button class="tgl '+(S.lang=='bn'?'on':'')+'" onclick="S.lang=S.lang==\'bn\'?\'en\':\'bn\';shell()"></button></div></div><div class="card"><div class="row"><span>Dark mode</span><button class="tgl '+(document.documentElement.dataset.theme=='dark'?'on':'')+'" onclick="dk()"></button></div></div><div class="card"><div class="row"><span>App lock</span><button class="tgl '+(S.lock?'on':'')+'" onclick="S.lock^=1;shell()"></button></div></div><div class="card t" onclick="toast(\'Export started — JSON + PDF\')"><div class="row"><span>Export my data</span><span>›</span></div></div><button class="btn o" onclick="out()">Sign out</button>'}],
admin:[
function(){var p=S.rvs.filter(function(x){return x.s=='pending'}).length,a=Math.round(S.tr.reduce(function(s,x){return s+x.p},0)/S.tr.length);return hd('Overview','HR · MTO programme')+'<div class="g2"><div class="card"><div class="big">'+S.tr.length+'</div><p class="sm">Active trainees</p></div><div class="card"><div class="big">312</div><p class="sm">Logs this week</p></div><div class="card t" onclick="S.tab=2;shell()"><div class="big">'+p+'</div><p class="sm">Reviews pending</p></div><div class="card"><div class="big">'+a+'%</div><p class="sm">Avg progress</p></div></div><div class="card"><b>Weekly logging</b><div class="chart"><i style="height:50%"></i><i style="height:65%"></i><i style="height:40%"></i><i style="height:80%" class="k"></i><i style="height:70%"></i><i style="height:55%"></i></div></div><div class="card t" onclick="S.tab=1;shell()"><div class="row"><span>Mim Akter has low progress</span><span class="tag w">Review</span></div></div>'},
function(){return hd('Trainees',S.tr.length+' active')+'<input placeholder="Search trainee or department" value="'+S.q+'" oninput="S.q=this.value;tl()"><div id="tl"></div>'},
function(){return hd('Reviews',S.rvs.filter(function(x){return x.s=='pending'}).length+' pending')+'<div class="seg"><button class="'+(S.rv=='pending'?'on':'')+'" onclick="S.rv=\'pending\';shell()">Pending</button><button class="'+(S.rv=='approved'?'on':'')+'" onclick="S.rv=\'approved\';shell()">Approved</button></div>'+(S.rvs.map(function(x,i){return x.s==S.rv?'<div class="card"><div class="row"><b>'+x.n+'</b><span class="tag '+(x.s=='pending'?'w':'g')+'">'+x.due+'</span></div><p class="sm">'+x.d+'</p>'+(x.s=='pending'?'<button class="btn s" onclick="rvw('+i+')">Open review</button>':'')+'</div>':''}).join('')||'<p>No items.</p>')},
function(){return hd('Reports','Programme insights')+'<div class="card"><b>Progress by department</b><div class="chart"><i style="height:90%" class="k"></i><i style="height:60%"></i><i style="height:75%"></i><i style="height:40%"></i></div><div class="row sm" style="margin-top:6px"><span>Fin</span><span>Mkt</span><span>Ops</span><span>Sales</span></div></div><div class="g2" style="margin-top:10px"><button class="btn o" onclick="toast(\'Monthly report.pdf ready\')">Export PDF</button><button class="btn o" onclick="toast(\'Monthly report.xlsx ready\')">Export XLSX</button></div>'},
function(){return hd('Settings','Admin')+'<div class="card"><div class="row"><span>Company</span><b>Your Company Ltd</b></div></div><div class="card t" onclick="try{navigator.clipboard.writeText(\'BD-2026-0412\')}catch(e){}toast(\'Invite code copied\')"><div class="row"><span>Invite code</span><span class="tag g">BD-2026-0412</span></div></div><div class="card"><div class="row"><span>Supervisors can view logs</span><button class="tgl on" onclick="this.classList.toggle(\'on\')"></button></div></div><div class="card"><div class="row"><span>Trainees can export data</span><button class="tgl on" onclick="this.classList.toggle(\'on\')"></button></div></div><button class="btn" onclick="addTr()">+ Add trainee</button><button class="btn o" onclick="out()">Sign out</button>'}]};
/* actions */
function rd(i){var x=S.rot[i];sheet('<div class="row"><h2>'+x.n+'</h2><span class="tag g">'+x.s+'</span></div><p class="sm">'+x.w+'</p><div style="margin:12px 0">'+x.o.map(function(o,j){var d=x.s=='Done'||(x.s=='Active'&&j<1);return '<div class="card"><div class="l"><div class="chk '+(d?'on':'')+'" onclick="this.classList.toggle(\'on\');this.textContent=this.classList.contains(\'on\')?\'✓\':\'\'">'+(d?'✓':'')+'</div>'+o+'</div></div>'}).join('')+'</div><button class="btn o" onclick="cl()">Close</button>')}
function addTask(){sheet('<h2>New task</h2><label>Task</label><input id="n1"><label>Due</label><input id="n2" placeholder="e.g. Fri 5 PM"><button class="btn" onclick="if(!n1.value.trim())return toast(\'Enter a task\');S.tasks.unshift({t:n1.value,due:n2.value||\'Today\',x:0});cl();shell();toast(\'Task added\')">Add task</button>')}
function saveLog(){var v=lt.value.trim();if(!v)return toast('Write something first');var g=[].map.call(document.querySelectorAll('.body .tag.g[onclick]'),function(e){return e.textContent});S.logs.unshift({t:v,g:g.length?g:['General'],d:'Today'});shell();toast('Log saved ✓')}
function lg(i){var x=S.logs[i];sheet('<h2>Log entry</h2><p style="color:var(--ink)">'+x.t+'</p><p class="sm">'+x.d+'</p><button class="btn o" onclick="S.logs.splice('+i+',1);cl();shell();toast(\'Log deleted\')">Delete log</button><button class="btn" onclick="cl()">Close</button>')}
function addGoal(){sheet('<h2>New learning goal</h2><label>Goal</label><input id="g1" placeholder="e.g. Presentation skills"><button class="btn" onclick="if(!g1.value.trim())return toast(\'Enter a goal\');S.goals.push({t:g1.value,p:0});cl();shell();toast(\'Goal added\')">Add goal</button>')}
function pack(){sheet('<h2>Review pack</h2><p>Building from your logs, goals and mentor notes…</p>'+bar(10)+'<div id="pk"></div>');setTimeout(function(){var i=document.querySelector('.sh .bar i');if(i)i.style.width='100%'},60);setTimeout(function(){var e=document.getElementById('pk');if(e){e.innerHTML='<div class="card"><b>Marketing_review_pack.pdf</b><p class="sm">'+S.logs.length+' logs · '+S.goals.length+' goals · 1 mentor note</p></div><button class="btn" onclick="cl();toast(\'Downloaded\')">Download</button>';note('admin','Review pack shared','Nusrat Jahan built a Marketing review pack')}},1300)}
function dk(){var r=document.documentElement;r.dataset.theme=r.dataset.theme=='dark'?'light':'dark';shell()}
function out(){sheet('<h2>Sign out?</h2><p>You can sign back in anytime.</p><button class="btn" onclick="login()">Sign out</button><button class="btn o" onclick="cl()">Cancel</button>')}
function tl(){var q=S.q.toLowerCase(),h=S.tr.map(function(x,i){return x.n.toLowerCase().indexOf(q)<0&&x.d.toLowerCase().indexOf(q)<0?'':'<div class="card t" onclick="trs('+i+')"><div class="row"><div class="l"><div class="av">'+ini(x.n)+'</div><div><b>'+x.n+'</b><div class="sm">'+x.d+'</div></div></div><span class="tag '+(x.p<30?'w':'g')+'">'+x.p+'%</span></div>'+bar(x.p)+'</div>'}).join('');document.getElementById('tl').innerHTML=h||'<p>No match.</p>'}
function trs(i){var x=S.tr[i];sheet('<div class="l"><div class="av">'+ini(x.n)+'</div><div><h2>'+x.n+'</h2><p class="sm" style="margin:0">'+x.d+'</p></div></div><div class="card"><div class="row"><span>Overall progress</span><b>'+x.p+'%</b></div>'+bar(x.p)+'</div><button class="btn" onclick="note(\'user\',\'Reminder from HR\',\'Please update your logs this week\');cl();toast(\'Reminder sent to '+x.n.split(' ')[0]+'\')">Send reminder</button><button class="btn o" onclick="cl()">Close</button>')}
function rvw(i){var x=S.rvs[i];rt=0;sheet('<h2>'+x.n+'</h2><p class="sm">'+x.d+'</p><label>Rating</label><div class="st" id="st">'+[1,2,3,4,5].map(function(n){return '<button onclick="rate('+n+')">★</button>'}).join('')+'</div><label>Comment</label><textarea id="cm" rows="3" placeholder="Feedback for the trainee…"></textarea><button class="btn" onclick="dec('+i+',1)">Approve</button><button class="btn o" onclick="dec('+i+',0)">Request changes</button>')}
function rate(n){rt=n;[].forEach.call(document.querySelectorAll('#st button'),function(b,j){b.className=j<n?'on':''})}
function dec(i,ok){if(!rt)return toast('Give a rating first');var x=S.rvs[i];if(ok){x.s='approved';x.due='Done';note('user','Review approved','Your '+x.d.split(' ·')[0]+' review was approved ('+rt+'/5)')}else note('user','Changes requested','HR asked for updates on '+x.d.split(' ·')[0]);cl();shell();toast(ok?'Review approved':'Changes requested')}
function addTr(){sheet('<h2>Add trainee</h2><label>Full name</label><input id="t1"><label>Department</label><input id="t2" placeholder="e.g. Sales"><button class="btn" onclick="if(!t1.value.trim())return toast(\'Enter a name\');S.tr.push({n:t1.value,d:(t2.value||\'Orientation\')+\' · Wk 1\',p:0});cl();toast(\'Trainee added · invite sent\')">Add &amp; invite</button>')}
V.admin[1]=(function(f){return function(){var h=f();setTimeout(tl,0);return h}})(V.admin[1]);
splash();
</script>
